<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        PocketSmart AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<header class="nav">

    <a
        class="brand"
        href="/"
    >
        PocketSmart
        <span>AI</span>
    </a>

    <nav>

        <a href="/home-planner">
            Home
        </a>

        <a href="/party-planner">
            Party
        </a>

        <a href="/jewelry-planner">
            Jewelry
        </a>

        {% if user %}

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/history">
                History
            </a>

            <a href="/api/logout">
                Logout
            </a>

        {% else %}

            <a href="/login">
                Login
            </a>

            <a
                class="button small"
                href="/register"
            >
                Register
            </a>

        {% endif %}

    </nav>

</header>


<main class="container">

    {% block content %}

    {% endblock %}

</main>


<footer class="footer">

    PocketSmart AI ·
    Budget-aware recommendations
    with Gemini

</footer>


<script src="/static/js/app.js"></script>


{% block scripts %}

{% endblock %}

</body>

</html>
